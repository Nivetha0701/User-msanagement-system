spring.application.name=spring-boot-demo

# Server Port (Render passes PORT environment variable)
server.port=${PORT:8080}

# Database configuration (supports cloud environment variables, falls back to local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ajuba?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Nive@07}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
