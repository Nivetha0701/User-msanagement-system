spring.application.name=spring-boot-demo

# Server Port (Render passes PORT environment variable)
server.port=${PORT:8080}

# Database configuration (supports cloud environment variables, falls back to local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ajuba?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Nive@07}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cloud / Serverless database resilience (TiDB / Aiven / Aurora)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.max-lifetime=45000
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.connection-timeout=30000

