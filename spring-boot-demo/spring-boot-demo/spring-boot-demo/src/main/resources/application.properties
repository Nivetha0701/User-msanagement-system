spring.application.name=spring-boot-demo

# Server Port (Render passes PORT environment variable)
server.port=${PORT:8080}

# Database configuration
# Supports cloud MySQL (TiDB / Aiven / RDS) via environment variable,
# with automatic embedded database fallback so the app is always 100% online and never crashes!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Error detail handling
server.error.include-message=always
server.error.include-binding-errors=always

# Cloud / Serverless database resilience (when external DB is connected)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.max-lifetime=45000
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.connection-timeout=30000

